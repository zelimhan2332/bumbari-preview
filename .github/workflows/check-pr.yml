name: Check Bumbari pull requests
on:
  pull_request:
    branches: [test]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run all checks
        run: |
          for test in preview/*.test.js; do node "$test" || exit 1; done
