name: Test and publish Bumbari
on:
  push:
    branches: [test]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run all checks
        run: |
          for test in preview/*.test.js; do node "$test" || exit 1; done
      - uses: actions/configure-pages@v5
      - name: Prepare browser-only artifact
        run: |
          mkdir site
          cp preview/*.js preview/index.html site/
          rm site/*.test.js
          cp -r preview/assets site/assets
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4